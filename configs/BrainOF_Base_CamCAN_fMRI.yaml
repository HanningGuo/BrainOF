# ------ basic settings ------
root: /path/to/BrainSignalDataset # the root path of dataset
out_root: /path/to/results  #<output-root-to-save-results>
num_workers: 12
seed: 3407

# ------ dataset settings ------
dataset:
  name: CamCAN_fMRI_Rest
  signal_size: [246, 256]

# ------ model settings ------
model:
  name: brainof_base_50M_A22M
  pretrained_model: /path/to/brainof_base_50M_A22M.pth
  max_seq_length: 984
  num_classes: 1
  init_scale: 0.1
  droppath: 0.1
#  use_lora: True

# ------ train settings ------
train:
  batch_size: 32 # global bsz 32
  epochs: 100
  clip_grad: 5.0
  aux_loss_free_alpha: 3.2e-4 # global bsz 32, actual 1e-5
  metrics: ['mae', 'rmse', 'r2', 'mape']
  main_metric: mae
  optimizer:
    base_lr: 1.6e-2 # global bsz 32, actual scaled lr 5e-4
    weight_decay: 1e-1
  lr_scheduler:
    warmup_epochs: 5
    warmup_lr: 1.6e-4 # global bsz 32, actual 5e-6
    min_lr: 1.6e-4
  criterion:
    task: prediction