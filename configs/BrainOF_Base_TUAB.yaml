# ------ basic settings ------
root: /path/to/BrainSignalDataset # the root path of dataset
out_root: /path/to/results  #<output-root-to-save-results>
print_freq: 50
num_workers: 12
seed: 3407

# ------ dataset settings ------
dataset:
  name: TUAB
  signal_size: [19, 2000]

# ------ model settings ------
model:
  name: brainof_base_50M_A22M
  pretrained_model: /path/to/brainof_base_50M_A22M.pth
  max_seq_length: 608
  num_classes: 2
  init_scale: 0.1
  droppath: 0.1
  # use_lora: True
  # enable_lp: True

# ------ train settings ------
train:
  batch_size: 256 # global batch size 1024 = 256 * 4 gpus
  epochs: 50
  clip_grad: 5.0
  aux_loss_free_alpha: 1e-5
  metrics: ['bac', 'aucpr', 'auroc']
  main_metric: bac
  optimizer:
    base_lr: 7e-6 # global batch size 1024
    weight_decay: 1e-1
  lr_scheduler:
    warmup_epochs: 5
    warmup_lr: 7e-8
    min_lr: 7e-8
  criterion:
    task: classification
    label_smoothing: 0.1